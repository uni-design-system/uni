<uni-input-box [error]="showError()" [width]="width()" [fullWidth]="fullWidth()" [grow]="grow()">
  <ng-content select="pre-input, [pre-input]" />
  <input
    [type]="type()"
    [value]="value()"
    (input)="handleInput($event)"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [readOnly]="readonly()"
    (blur)="markAsTouched()"
    [class]="inputClass"
    [attr.name]="name() || null"
    [attr.autocomplete]="autocomplete() || null"
    [attr.inputmode]="inputMode() || null"
    [attr.list]="list() || null"
    [attr.min]="min() ?? null"
    [attr.max]="max() ?? null"
    [attr.step]="step() ?? null"
    [attr.minlength]="minLength() ?? null"
    [attr.maxlength]="maxLength() ?? null"
    [attr.pattern]="nativePattern()"
    [attr.spellcheck]="spellcheck() ?? null"
    [attr.aria-label]="label()"
    [attr.aria-invalid]="showError() ? true : null"
    [attr.aria-required]="required() ? true : null"
    [attr.aria-describedby]="ariaDescribedBy() || null"
  />
  <ng-content select="post-input, [post-input]" />
</uni-input-box>
