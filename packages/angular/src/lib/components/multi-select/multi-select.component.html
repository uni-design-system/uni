<div box-layout display="flex" [flexDirection]="flexDirection()" [gap]="checkboxGap()">
  <!-- track $index: option values may be objects and consumers rebuild the
       array, so identity tracking recreated every node (NG0956). -->
  @for (option of options(); track $index) {
    <div [class]="optionWrapper">
      <uni-checkbox
        [label]="option.label"
        [checked]="values().indexOf(option.value) > -1"
        (checkedChange)="handleCheck($event, option.value)"
        variant="primary"
        [disabled]="!!option.disabled"
      >
      </uni-checkbox>
    </div>
  }
</div>
