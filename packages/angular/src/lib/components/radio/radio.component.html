<div
  [class]="radioGroupClass()"
  role="radiogroup"
  [attr.aria-labelledby]="label() ? groupLabelId : null"
  [attr.aria-invalid]="showError() ? true : null"
  [attr.aria-required]="required() ? true : null"
  [attr.aria-describedby]="ariaDescribedBy() || null"
>
  @if (label()) {
    @if (labelHidden()) {
      <span [class]="srOnlyClass" [attr.id]="groupLabelId">{{ label() }}</span>
    } @else {
      <span
        uni-text
        [typeface]="componentOptions().groupTextRole ?? 'label'"
        [color]="componentOptions().groupTextColor"
        [attr.id]="groupLabelId"
        >{{ label() }}</span
      >
    }
  }

  @for (option of options(); track option.value) {
    <label [class]="radioOptionClass()" [class.disabled]="disabled() || option.disabled">
      <input
        type="radio"
        [class]="radioInputClass()"
        [value]="option.value"
        [name]="name()"
        [checked]="value() === option.value"
        [disabled]="disabled() || option.disabled"
        (change)="handleRadioChange(option.value)"
      />
      <div class="radio-button">
        <div class="radio-inner"></div>
      </div>
      <!-- A group renders N labels from data, so it has no single slot to
      project into; the option template is instantiated per option instead. -->
      @if (optionTemplate(); as projected) {
        <ng-container
          [ngTemplateOutlet]="projected.template"
          [ngTemplateOutletContext]="{ $implicit: option }"
        />
      } @else {
        <span
          uni-text
          [typeface]="componentOptions().textRole ?? 'label'"
          [color]="componentOptions().textColor"
          >{{ option.label }}</span
        >
      }
    </label>
  }
</div>
