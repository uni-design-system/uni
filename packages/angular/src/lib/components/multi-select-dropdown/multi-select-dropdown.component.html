<button
  [class]="triggerClass"
  #trigger
  [style.cursor]="disabled() ? 'default' : 'pointer'"
  [attr.aria-required]="required() ? true : null"
  [attr.aria-invalid]="showError() ? true : null"
  [attr.aria-describedby]="ariaDescribedBy() || null"
  (click)="!disabled() && touched.set(true)"
>
  @if (label(); as fieldLabel) {
    <span [class]="srOnly">{{ fieldLabel }},</span>
  }
  <span [class]="srOnly">{{ selectionSummary() }}</span>
  <uni-input-box [error]="showError()" [disabled]="disabled()">
    <div
      row-layout
      alignItems="center"
      justifyContent="space-between"
      [fullWidth]="true"
      [minWidth]="0"
      paddingLeft="sm"
    >
      <span uni-text
        display="block"
        [typeface]="componentOptions().textRole"
        [color]="textColor()"
        [ellipsis]="true"
        [style.flex-grow]="1"
        >{{ selectedLabelsText() }}</span>
      <uni-symbol name="keyboard_arrow_down" [style.flex-shrink]="0"></uni-symbol>
    </div>
  </uni-input-box>
</button>
<uni-dropdown
  #dropdown
  [trigger]="trigger"
  ariaHasPopup="dialog"
  (dropdownShowing)="$event && searchInput.focus()"
  (dropdownHiding)="$event && trigger.focus()"
>
  <!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -->
  <div (keydown)="onPanelKeydown($event)">
  <div box-layout gap="xs" padding="xs">
    <input
      #searchInput
      type="text"
      [class]="searchInputClass()"
      [value]="query()"
      (input)="handleQueryInput($event)"
      placeholder="Search..."
      aria-label="Filter options"
      (click)="$event.stopPropagation()"
      [disabled]="disabled()"
    />
  </div>

  <uni-divider [border]="componentOptions().dividerBorder" />

  <div
    stack-layout
    gap="xs"
    padding="xs"
    role="group"
    [attr.aria-label]="label() ? label() + ' options' : 'Options'"
  >
    @for (option of filteredOptions(); track option.value; let i = $index) {
      <div #optionRow (focusin)="onOptionFocus(i)">
        <uni-checkbox
          [label]="option.label"
          [checked]="isOptionSelected(option)()"
          (checkedChange)="toggleOption(option, $event)"
          variant="primary"
          [disabled]="disabled()"
        >
        </uni-checkbox>
      </div>
    }
    @if (filteredOptions().length === 0) {
      <span uni-text="label" role="status">No options match.</span>
    }
  </div>

  <uni-divider [border]="componentOptions().dividerBorder" />

  <div row-layout gap="xs" justifyContent="space-around" padding="xs">
    <button text-button (click)="dropdown.hideDropdown()" size="sm" variant="ghost">Done</button>
  </div>
  </div>
</uni-dropdown>
