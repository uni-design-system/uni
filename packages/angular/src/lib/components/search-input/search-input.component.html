<!-- Keydown/focusout ride the bubbling events from the inner input; the
     wrapper itself stays out of the tab order. -->
<!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -->
<div (keydown)="onKeydown($event)" (focusout)="onFocusOut($event)">
  <uni-debounce-input
    #searchField
    [label]="label()"
    [placeholder]="placeholder() ?? label()"
    [debounceTime]="debounceTime()"
    role="combobox"
    [ariaExpanded]="list.open()"
    [ariaControls]="listboxId"
    [ariaActivedescendant]="list.activeDescendantId() ?? undefined"
    (valueChange)="handleChange($event)"
  >
    <uni-symbol pre-input class="uni-search-lead" name="{{ componentOptions().searchSymbol ?? 'search' }}" aria-hidden="true" />
    @if (hasQuery()) {
      <button
        post-input
        icon-button
        [iconName]="componentOptions().clearSymbol ?? 'close'"
        variant="ghost"
        size="sm"
        (click)="clear()"
      >
        Clear search
      </button>
    }
  </uni-debounce-input>

  @if (list.open()) {
    <ul
      #listbox
      [id]="listboxId"
      role="listbox"
      [attr.popover]="popupAttr"
      [attr.aria-label]="label()"
      [class]="listClass()"
    >
      @for (suggestion of visibleSuggestions(); track suggestion; let i = $index) {
        <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
        <li
          role="option"
          [id]="list.optionId(i)"
          [class.active]="i === list.activeIndex()"
          [attr.aria-selected]="i === list.activeIndex()"
          (mousedown)="$event.preventDefault()"
          (click)="select(suggestion)"
        >
          {{ suggestion }}
        </li>
      }
    </ul>
  }
</div>
