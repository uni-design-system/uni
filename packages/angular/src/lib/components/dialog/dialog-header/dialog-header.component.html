<div
  row-layout
  [color]="componentOptions().color"
  [borderRadius]="componentOptions().borderRadius"
  [height]="componentOptions().height"
  alignItems="center"
  [paddingHorizontal]="componentOptions().paddingHorizontal ?? 'sm'"
>
  <!-- Balance spacer: only centered titles need to offset the close button. -->
  @if ((componentOptions().textAlign || 'center') === 'center') {
    <div box-layout [width]="26"></div>
  }
  <div box-layout [grow]="1" [attr.id]="titleId">
    <span uni-text
      [typeface]="componentOptions().textRole"
      [color]="componentOptions().textColor"
      display="block"
      [align]="componentOptions().textAlign || 'center'"
      ><ng-content></ng-content
    ></span>
  </div>
  <button
    icon-button
    [iconName]="componentOptions().closeButtonIcon"
    [symbolName]="componentOptions().closeButtonSymbol"
    variant="ghost"
    (click)="closeDialog()"
    [size]="componentOptions().closeButtonSize || 'md'"
  >
    Close
  </button>
</div>
