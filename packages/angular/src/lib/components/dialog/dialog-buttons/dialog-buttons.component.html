<div
  row-layout
  [gap]="gapValue()"
  [padding]="paddingValue()"
  [paddingBottom]="paddingBottomValue()"
  [justifyContent]="justifyContentValue()"
  [alignItems]="componentOptions().alignItems ?? 'center'"
  [flexDirection]="componentOptions().reverseOrder ? 'row-reverse' : 'row'"
  [class]="className()"
>
  <span [class]="footnoteClass()"
    ><ng-content select="[uni-dialog-footnote], [dialog-footnote]"
  /></span>
  <!-- Projected actions replace the pair; the pair is the fallback. -->
  <ng-content>
    <button
      text-button
      [variant]="confirmVariant()"
      [size]="buttonSize()"
      (click)="onConfirm()"
      [disable]="disableConfirm()"
      [loading]="loading()"
    >
      {{ confirmButtonText() || 'Confirm' }}
    </button>
    <button text-button [variant]="cancelVariant()" [size]="buttonSize()" (click)="closeDialog()">
      {{ cancelButtonText() || 'Cancel' }}
    </button>
  </ng-content>
</div>
