<label [class]="toggleLabel()">
  <input
    type="checkbox"
    role="switch"
    [class]="toggleInput()"
    [checked]="checked()"
    (change)="handleChange($event)"
    [disabled]="disabled()"
    [attr.aria-invalid]="showError() ? true : null"
    [attr.aria-required]="required() ? true : null"
    [attr.aria-describedby]="ariaDescribedBy() || null"
  />
  <div class="toggle-switch">
    <div class="toggle-slider"></div>
  </div>
  @if (label()) {
    @if (labelHidden()) {
      <span [class]="srOnlyClass">{{ label() }}</span>
    } @else {
      <span
        uni-text
        [typeface]="componentOptions().textRole ?? 'label'"
        [color]="componentOptions().textColor"
        >{{ label() }}</span
      >
    }
  }
  <!-- Projected content sits inside the control's own <label>, which is the
  only way a whole row can be the hit target: HTML forbids nesting a <label>,
  so a consumer cannot wrap one around a uni-toggle. -->
  <ng-content />
</label>
