<uni-input-box [error]="showError()" [class]="selectClass" [width]="width()" [fullWidth]="fullWidth()" [grow]="grow()">
  <select
    [disabled]="disabled()"
    [value]="currentSelectedIndex()"
    (change)="handleSelectChange($event)"
    (blur)="touched.set(true)"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-invalid]="showError() ? true : null"
    [attr.aria-required]="required() ? true : null"
    [attr.aria-describedby]="ariaDescribedBy() || null"
  >
    <!-- The "nothing selected" option. Rendered whenever the model holds no
         option — with a placeholder, as the placeholder; without one, hidden —
         because a <select> with no selected <option> shows its first entry,
         and the field would then display a choice the model does not hold. -->
    @if (placeholder() || unmatched()) {
      <option [value]="UNSELECTED" disabled selected [hidden]="!placeholder()">
        {{ placeholder() ?? '' }}
      </option>
    }

    @for (opt of options(); track opt.label; let i = $index) {
      <!-- [selected] evaluates during the option's own render, so a selection
           pointing at an option added in the same change-detection pass still
           applies (the select-level [value] write lands before new options
           exist and is ignored by the browser). -->
      <option
        [value]="i"
        [selected]="currentSelectedIndex() === i.toString()"
        [disabled]="opt.disabled ?? false"
      >
        {{ opt.label }}
      </option>
    }
  </select>
  <uni-icon
    [name]="componentOptions().toggleIcon ?? 'chevronDown'"
    [size]="componentOptions().toggleSize ?? 20"
    [class]="arrowClass()"
  />
</uni-input-box>
