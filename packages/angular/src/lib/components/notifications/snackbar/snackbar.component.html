@let icon = iconName();
@let symbol = symbolName();
<!-- role="status" announces the message politely without stealing focus -->
<dialog
  #snackbar
  [class]="snackbarClass()"
  role="status"
  (mouseenter)="pauseTimer()"
  (mouseleave)="resumeTimer()"
  (focusin)="pauseTimer()"
  (focusout)="resumeTimer()"
>
  <div row-layout alignItems="center">
    @if (icon || symbol) {
      <div box-layout [height]="26" [width]="26" paddingLeft="sm">
        @if (icon) {
          <uni-icon [name]="icon"></uni-icon>
        } @else if (symbol) {
          <uni-symbol [name]="symbol" [opticalSize]="26"></uni-symbol>
        }
      </div>
    }
    <div box-layout padding="sm">
      <span uni-text>
        <ng-content></ng-content>
      </span>
    </div>
    <div box-layout paddingRight="sm">
      @if (!actionLabel()) {
        <button icon-button (click)="close()" iconName="close" size="md">Close</button>
      } @else {
        <button text-button variant="ghost" (click)="this.action.emit(); close()">
          {{ actionLabel() }}
        </button>
      }
    </div>
  </div>
</dialog>
