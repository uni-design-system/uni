@let tpl = template();
@let symbol = symbolName();
@if (symbol) {
  <uni-symbol [name]="symbol"></uni-symbol>
}
<div box-layout [grow]="1">
  @if (tpl) {
    <ng-container [ngTemplateOutlet]="tpl" [ngTemplateOutletContext]="context()"></ng-container>
  } @else {
    <span [class]="LabelClassName">{{ label() }}</span>
  }
</div>
@let activeSym = activeIcon();
@if (active() && activeSym) {
  <uni-icon size="24" [name]="activeSym"></uni-icon>
}
