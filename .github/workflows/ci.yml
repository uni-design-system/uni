name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo run build

      - name: Lint
        run: pnpm turbo run lint

      - name: Test
        run: pnpm turbo run test

      # Both Storybooks: these bundle uni-core rather than treating it as an
      # external, so they are the step that resolves its exports against real
      # consumer source. A core export removed without updating a consumer
      # fails here — the React build alone would not catch it.
      - name: Build Storybooks (smoke test)
        run: pnpm turbo run build-storybook
