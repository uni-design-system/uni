# The only workflow. Everything that happens to `main` happens here, in order,
# in one job — because the ordering is the point: nothing publishes to npm
# until build, lint, test and both Storybooks have passed.
#
# A changeset on `main` means "this is releasable". Push one and this run
# versions it, commits the bump back, publishes over OIDC, tags, cuts the
# GitHub Releases and deploys the docs. Push without one and it verifies and
# deploys docs only. There is no button and no Version PR.
#
# It replaces three workflows that ran in parallel on every push (ci, release,
# deploy-docs). Those each did their own `pnpm install`, two of them built both
# Storybooks, and — critically — the release ran *alongside* the tests rather
# than after them, so a package could reach npm before anything had verified it.
#
# The filename is load-bearing: npm's trusted publisher config pins the exact
# workflow filename, so renaming this file breaks OIDC publishing for all four
# packages until every one is updated on npmjs.com. Hence `release.yml` even
# though the workflow now does far more than release.
#
# There is deliberately no `pull_request` trigger. Every pull request this repo
# has ever had was opened by the changesets bot, and GitHub holds bot-authored
# PR runs behind a manual approval that nobody gives, so those runs only ever
# expired unapproved and reported as failures having run zero jobs. Nothing is
# lost by dropping it; if a human PR ever arrives, add the trigger back.
name: Main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never cancel in flight: this run can publish to npm and push to gh-pages,
  # and a half-finished release is worse than a queued one.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  verify-and-release:
    name: Verify, Release & Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: write # git tags, GitHub Releases, gh-pages push
      id-token: write # npm OIDC trusted publishing

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: changesets resolves which commit introduced each
          # changeset to build the changelog links, and a depth-1 clone cannot
          # answer that — the entries degrade to bare text.
          fetch-depth: 0
          # Explicit because this run pushes the version bump back to `main`.
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # One invocation so turbo can schedule across the whole task graph rather
      # than stopping at three barriers; its log prefixes keep attribution clear.
      - name: Build, lint & test
        run: pnpm turbo run build lint test

      # Both Storybooks: these bundle uni-core rather than treating it as an
      # external, so they are the step that resolves its exports against real
      # consumer source. A core export removed without updating a consumer
      # fails here — the React build alone would not catch it.
      - name: Build Storybooks (smoke test)
        run: pnpm turbo run build-storybook

      # A changeset on `main` means "this is releasable", so the pipeline
      # releases it. Written as a shell test rather than `hashFiles(...)`: a
      # stray `.changeset/README.md` (which `changeset init` creates) would make
      # a glob permanently non-empty and stall every future release behind a
      # green checkmark, so being explicit about which files count is worth it.
      - name: Check for unconsumed changesets
        id: changesets
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d '[:space:]')
          echo "pending changesets: $pending"
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          if [ "$pending" -gt 0 ]; then echo "release=yes" >> "$GITHUB_OUTPUT"; fi

      # Versioning runs here rather than on a maintainer's machine because this
      # is where the credentials are: `@changesets/changelog-github` needs a
      # GITHUB_TOKEN to resolve commit links and throws without one, and the
      # runner is handed one automatically.
      #
      # `version-packages` consumes the changesets, bumps the fixed group, writes
      # the CHANGELOGs and regenerates the MCP index — which is why the Storybook
      # build above has to come first, since the index reads its examples.
      #
      # The bump is committed straight back to `main`. A push made with
      # GITHUB_TOKEN does not start another workflow run, so this cannot loop —
      # and it is also why publishing has to happen in this same run, below.
      - name: Version packages
        if: steps.changesets.outputs.release == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm run version-packages
          git add -A
          git commit -m "Version Packages [skip ci]"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Always runs, and does nothing on a push that released nothing: with no
      # version ahead of the registry `changeset publish` reports "No unpublished
      # projects to publish" and exits 0, before any auth is attempted. A green
      # tick here is not proof that something shipped — read the step log.
      #
      # Still `changesets/action` rather than a bare `changeset publish` because
      # it also pushes the tags and cuts the GitHub Releases. It can no longer
      # open a Version PR: the step above always consumes the changesets first,
      # so by this point there are never any left for it to act on.
      - name: Publish to npm
        uses: changesets/action@v1
        with:
          publish: pnpm exec changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # After publish, deliberately: an npm publish is irreversible, a docs
      # deploy is idempotent. Do the irreversible thing while the tree is known
      # good, and leave the repeatable one to be re-run via workflow_dispatch.
      - name: Deploy React docs
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: packages/react/storybook-static
          target-folder: docs/react

      - name: Deploy Angular docs
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: packages/angular/storybook-static
          target-folder: docs/angular

      - name: Summarise
        if: always()
        run: |
          if [ "${{ steps.changesets.outputs.release }}" = "yes" ]; then
            echo "Released: ${{ steps.changesets.outputs.pending }} changeset(s) consumed and published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release: no changesets were pending, so nothing was versioned or published." >> "$GITHUB_STEP_SUMMARY"
          fi
